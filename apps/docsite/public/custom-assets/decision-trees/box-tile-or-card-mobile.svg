<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1036" width="380" height="1036" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Box, Tile, or Card decision tree</title>
  <desc id="desc">Answer up to four questions from top to bottom. Is the whole block one link? Yes: Card. Is it one topic with a title? Yes: Card. Should it look like our standard panel? Yes: Tile. Does it need its own special look? Yes: Box. No to all: no container, only spacing and layout.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6B7280"/>
    </marker>
    <marker id="arrowYes" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F7B3F"/>
    </marker>
    <linearGradient id="boxGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD9A8"/>
      <stop offset="1" stop-color="#FFB3C1"/>
    </linearGradient>
  </defs>
  <rect width="380" height="1036" fill="#FFFFFF"/>
  <line x1="60" y1="116" x2="60" y2="248" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="36.0" y="167" width="48" height="26" rx="13" fill="#F3F4F6" stroke="#D1D5DB"/><text x="60" y="185" font-size="14" font-weight="700" fill="#4B5563" text-anchor="middle">No</text>
  <line x1="260" y1="116" x2="260" y2="168" stroke="#0F7B3F" stroke-width="2" marker-end="url(#arrowYes)"/>
  <rect x="234.0" y="127" width="52" height="26" rx="13" fill="#E6F6EC" stroke="#0F7B3F"/><text x="260" y="145" font-size="14" font-weight="700" fill="#0F7B3F" text-anchor="middle">Yes</text>
  <rect x="150" y="170" width="210" height="60" rx="12" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="3"/>
  <g transform="translate(162 181)"><rect width="48" height="38" rx="5" fill="#FFFFFF" stroke="#2F6FDE" stroke-width="2"/><rect x="5" y="5" width="38" height="14" rx="3" fill="#BFD6F8"/><rect x="5" y="23" width="24" height="4" rx="2" fill="#2F6FDE"/><rect x="5" y="30" width="34" height="4" rx="2" fill="#BFD6F8"/></g>
  <text x="222" y="198" font-size="20" font-weight="700" fill="#1F4FA3">Card</text>
  <text x="222" y="217" font-size="12.5" fill="#1F2937">One topic or link</text>
  <rect x="20" y="20" width="340" height="96" rx="14" fill="#F5F7FA" stroke="#CBD2DC" stroke-width="2"/>
  <circle cx="48" cy="68" r="15" fill="#1F2937"/><text x="48" y="74" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="76" y="60" font-size="16" font-weight="700" fill="#1F2937">Is the whole block one link?</text>
  <text x="76" y="84" font-size="13" fill="#4B5563">Clicking anywhere opens one page</text>
  <line x1="60" y1="346" x2="60" y2="478" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="36.0" y="397" width="48" height="26" rx="13" fill="#F3F4F6" stroke="#D1D5DB"/><text x="60" y="415" font-size="14" font-weight="700" fill="#4B5563" text-anchor="middle">No</text>
  <line x1="260" y1="346" x2="260" y2="398" stroke="#0F7B3F" stroke-width="2" marker-end="url(#arrowYes)"/>
  <rect x="234.0" y="357" width="52" height="26" rx="13" fill="#E6F6EC" stroke="#0F7B3F"/><text x="260" y="375" font-size="14" font-weight="700" fill="#0F7B3F" text-anchor="middle">Yes</text>
  <rect x="150" y="400" width="210" height="60" rx="12" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="3"/>
  <g transform="translate(162 411)"><rect width="48" height="38" rx="5" fill="#FFFFFF" stroke="#2F6FDE" stroke-width="2"/><rect x="5" y="5" width="38" height="14" rx="3" fill="#BFD6F8"/><rect x="5" y="23" width="24" height="4" rx="2" fill="#2F6FDE"/><rect x="5" y="30" width="34" height="4" rx="2" fill="#BFD6F8"/></g>
  <text x="222" y="428" font-size="20" font-weight="700" fill="#1F4FA3">Card</text>
  <text x="222" y="447" font-size="12.5" fill="#1F2937">One topic or link</text>
  <rect x="20" y="250" width="340" height="96" rx="14" fill="#F5F7FA" stroke="#CBD2DC" stroke-width="2"/>
  <circle cx="48" cy="298" r="15" fill="#1F2937"/><text x="48" y="304" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="76" y="290" font-size="16" font-weight="700" fill="#1F2937">Is it one topic with a title?</text>
  <text x="76" y="314" font-size="13" fill="#4B5563">Like a job offer or an article preview</text>
  <line x1="60" y1="576" x2="60" y2="708" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="36.0" y="627" width="48" height="26" rx="13" fill="#F3F4F6" stroke="#D1D5DB"/><text x="60" y="645" font-size="14" font-weight="700" fill="#4B5563" text-anchor="middle">No</text>
  <line x1="260" y1="576" x2="260" y2="628" stroke="#0F7B3F" stroke-width="2" marker-end="url(#arrowYes)"/>
  <rect x="234.0" y="587" width="52" height="26" rx="13" fill="#E6F6EC" stroke="#0F7B3F"/><text x="260" y="605" font-size="14" font-weight="700" fill="#0F7B3F" text-anchor="middle">Yes</text>
  <rect x="150" y="630" width="210" height="60" rx="12" fill="#E6F6EC" stroke="#1F9D55" stroke-width="3"/>
  <g transform="translate(162 641)"><rect width="48" height="38" rx="5" fill="#FFFFFF" stroke="#1F9D55" stroke-width="2"/><rect x="6" y="7" width="22" height="4" rx="2" fill="#1F9D55"/><rect x="6" y="15" width="36" height="6" rx="2" fill="#C4E8D1"/><rect x="6" y="25" width="36" height="6" rx="2" fill="#C4E8D1"/></g>
  <text x="222" y="658" font-size="20" font-weight="700" fill="#14693A">Tile</text>
  <text x="222" y="677" font-size="12.5" fill="#1F2937">Standard panel</text>
  <rect x="20" y="480" width="340" height="96" rx="14" fill="#F5F7FA" stroke="#CBD2DC" stroke-width="2"/>
  <circle cx="48" cy="528" r="15" fill="#1F2937"/><text x="48" y="534" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="76" y="514" font-size="16" font-weight="700" fill="#1F2937">Should it look like our</text>
  <text x="76" y="534" font-size="16" font-weight="700" fill="#1F2937">standard panel?</text>
  <text x="76" y="558" font-size="13" fill="#4B5563">Standard background and border</text>
  <line x1="60" y1="806" x2="60" y2="938" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="36.0" y="857" width="48" height="26" rx="13" fill="#F3F4F6" stroke="#D1D5DB"/><text x="60" y="875" font-size="14" font-weight="700" fill="#4B5563" text-anchor="middle">No</text>
  <line x1="260" y1="806" x2="260" y2="858" stroke="#0F7B3F" stroke-width="2" marker-end="url(#arrowYes)"/>
  <rect x="234.0" y="817" width="52" height="26" rx="13" fill="#E6F6EC" stroke="#0F7B3F"/><text x="260" y="835" font-size="14" font-weight="700" fill="#0F7B3F" text-anchor="middle">Yes</text>
  <rect x="150" y="860" width="210" height="60" rx="12" fill="#FFF1E0" stroke="#E07B00" stroke-width="3"/>
  <g transform="translate(162 871)"><rect width="48" height="38" rx="3" fill="url(#boxGradient)" stroke="#E07B00" stroke-width="2" stroke-dasharray="4 3"/><circle cx="24" cy="19" r="8" fill="#FFFFFF" fill-opacity="0.8"/></g>
  <text x="222" y="888" font-size="20" font-weight="700" fill="#A85A00">Box</text>
  <text x="222" y="907" font-size="12.5" fill="#1F2937">Your own surface</text>
  <rect x="20" y="710" width="340" height="96" rx="14" fill="#F5F7FA" stroke="#CBD2DC" stroke-width="2"/>
  <circle cx="48" cy="758" r="15" fill="#1F2937"/><text x="48" y="764" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="76" y="744" font-size="16" font-weight="700" fill="#1F2937">Does it need its own</text>
  <text x="76" y="764" font-size="16" font-weight="700" fill="#1F2937">special look?</text>
  <text x="76" y="788" font-size="13" fill="#4B5563">A color, a gradient, or a dashed border</text>
  <rect x="20" y="940" width="340" height="76" rx="14" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="44" y="974" font-size="16" font-weight="700" fill="#1F2937">No container needed</text>
  <text x="44" y="996" font-size="13" fill="#4B5563">Just space and align the content</text>
</svg>
