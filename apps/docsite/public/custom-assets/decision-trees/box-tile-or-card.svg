<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 760" width="1010" height="760" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Box, Tile, or Card decision tree</title>
  <desc id="desc">Answer up to four questions from top to bottom. Is the whole block one link? Yes: Card. Is it one topic with a title? Yes: Card. Should it look like the standard panel? Yes: Tile. Does it need its own special look? Yes: Box. No to all: no container, only spacing and layout.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6B7280"/>
    </marker>
    <linearGradient id="boxGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD9A8"/>
      <stop offset="1" stop-color="#FFB3C1"/>
    </linearGradient>
  </defs>

  <rect width="1010" height="760" fill="#FFFFFF"/>

  <!-- Arrows between questions (No) -->
  <g stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="260" y1="146" x2="260" y2="198"/>
    <line x1="260" y1="296" x2="260" y2="348"/>
    <line x1="260" y1="446" x2="260" y2="498"/>
    <line x1="260" y1="596" x2="260" y2="648"/>
  </g>
  <g font-size="14" font-weight="700" fill="#4B5563" text-anchor="middle">
    <rect x="236" y="150" width="48" height="26" rx="13" fill="#F3F4F6" stroke="#D1D5DB"/><text x="260" y="168">No</text>
    <rect x="236" y="300" width="48" height="26" rx="13" fill="#F3F4F6" stroke="#D1D5DB"/><text x="260" y="318">No</text>
    <rect x="236" y="450" width="48" height="26" rx="13" fill="#F3F4F6" stroke="#D1D5DB"/><text x="260" y="468">No</text>
    <rect x="236" y="600" width="48" height="26" rx="13" fill="#F3F4F6" stroke="#D1D5DB"/><text x="260" y="618">No</text>
  </g>

  <!-- Arrows to results (Yes) -->
  <g stroke="#0F7B3F" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="490" y1="98" x2="618" y2="98"/>
    <line x1="490" y1="248" x2="618" y2="248"/>
    <line x1="490" y1="398" x2="618" y2="398"/>
    <line x1="490" y1="548" x2="618" y2="548"/>
  </g>
  <g font-size="14" font-weight="700" fill="#0F7B3F" text-anchor="middle">
    <rect x="528" y="85" width="52" height="26" rx="13" fill="#E6F6EC" stroke="#0F7B3F"/><text x="554" y="103">Yes</text>
    <rect x="528" y="235" width="52" height="26" rx="13" fill="#E6F6EC" stroke="#0F7B3F"/><text x="554" y="253">Yes</text>
    <rect x="528" y="385" width="52" height="26" rx="13" fill="#E6F6EC" stroke="#0F7B3F"/><text x="554" y="403">Yes</text>
    <rect x="528" y="535" width="52" height="26" rx="13" fill="#E6F6EC" stroke="#0F7B3F"/><text x="554" y="553">Yes</text>
  </g>

  <!-- Questions -->
  <g>
    <rect x="30" y="50" width="460" height="96" rx="16" fill="#F5F7FA" stroke="#CBD2DC" stroke-width="2"/>
    <circle cx="68" cy="98" r="18" fill="#1F2937"/>
    <text x="68" y="104" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="100" y="92" font-size="18" font-weight="700" fill="#1F2937">Is the whole block one link?</text>
    <text x="100" y="116" font-size="14" fill="#4B5563">Clicking anywhere opens one page</text>

    <rect x="30" y="200" width="460" height="96" rx="16" fill="#F5F7FA" stroke="#CBD2DC" stroke-width="2"/>
    <circle cx="68" cy="248" r="18" fill="#1F2937"/>
    <text x="68" y="254" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="100" y="242" font-size="18" font-weight="700" fill="#1F2937">Is it one topic with a title?</text>
    <text x="100" y="266" font-size="14" fill="#4B5563">Like a job offer or an article preview</text>

    <rect x="30" y="350" width="460" height="96" rx="16" fill="#F5F7FA" stroke="#CBD2DC" stroke-width="2"/>
    <circle cx="68" cy="398" r="18" fill="#1F2937"/>
    <text x="68" y="404" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="100" y="392" font-size="18" font-weight="700" fill="#1F2937">Should it look like our standard panel?</text>
    <text x="100" y="416" font-size="14" fill="#4B5563">Standard background, border, rounded corners</text>

    <rect x="30" y="500" width="460" height="96" rx="16" fill="#F5F7FA" stroke="#CBD2DC" stroke-width="2"/>
    <circle cx="68" cy="548" r="18" fill="#1F2937"/>
    <text x="68" y="554" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="100" y="542" font-size="18" font-weight="700" fill="#1F2937">Does it need its own special look?</text>
    <text x="100" y="566" font-size="14" fill="#4B5563">A color, a gradient, or a dashed border</text>
  </g>

  <!-- Result: Card (questions 1 and 2) -->
  <g>
    <rect x="620" y="50" width="360" height="250" rx="16" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="3"/>
    <g transform="translate(645 140)">
      <rect width="90" height="70" rx="8" fill="#FFFFFF" stroke="#2F6FDE" stroke-width="2"/>
      <rect x="8" y="8" width="74" height="28" rx="4" fill="#BFD6F8"/>
      <rect x="8" y="44" width="46" height="6" rx="3" fill="#2F6FDE"/>
      <rect x="8" y="55" width="66" height="6" rx="3" fill="#BFD6F8"/>
    </g>
    <text x="755" y="150" font-size="26" font-weight="700" fill="#1F4FA3">Card</text>
    <text x="755" y="176" font-size="14" fill="#1F2937">
      <tspan x="755">One topic or one clickable</tspan>
      <tspan x="755" dy="18">block, built from Card parts</tspan>
    </text>
    <text x="755" y="228" font-size="13" fill="#4B5563">
      <tspan x="755">e.g. job offer, article preview</tspan>
    </text>
  </g>

  <!-- Result: Tile (question 3) -->
  <g>
    <rect x="620" y="343" width="360" height="110" rx="16" fill="#E6F6EC" stroke="#1F9D55" stroke-width="3"/>
    <g transform="translate(645 363)">
      <rect width="90" height="70" rx="8" fill="#FFFFFF" stroke="#1F9D55" stroke-width="2"/>
      <rect x="10" y="12" width="40" height="6" rx="3" fill="#1F9D55"/>
      <rect x="10" y="26" width="70" height="10" rx="3" fill="#C4E8D1"/>
      <rect x="10" y="42" width="70" height="10" rx="3" fill="#C4E8D1"/>
    </g>
    <text x="755" y="385" font-size="26" font-weight="700" fill="#14693A">Tile</text>
    <text x="755" y="408" font-size="14" fill="#1F2937">
      <tspan x="755">Standard panel, free content</tspan>
    </text>
    <text x="755" y="432" font-size="13" fill="#4B5563">
      <tspan x="755">e.g. settings panel, form step</tspan>
    </text>
  </g>

  <!-- Result: Box (question 4) -->
  <g>
    <rect x="620" y="493" width="360" height="110" rx="16" fill="#FFF1E0" stroke="#E07B00" stroke-width="3"/>
    <g transform="translate(645 513)">
      <rect width="90" height="70" rx="4" fill="url(#boxGradient)" stroke="#E07B00" stroke-width="2" stroke-dasharray="6 4"/>
      <circle cx="45" cy="35" r="14" fill="#FFFFFF" fill-opacity="0.8"/>
    </g>
    <text x="755" y="535" font-size="26" font-weight="700" fill="#A85A00">Box</text>
    <text x="755" y="558" font-size="14" fill="#1F2937">
      <tspan x="755">A surface you style yourself</tspan>
    </text>
    <text x="755" y="582" font-size="13" fill="#4B5563">
      <tspan x="755">e.g. tinted notice, framed icon</tspan>
    </text>
  </g>

  <!-- Result: no container -->
  <g>
    <rect x="30" y="650" width="460" height="80" rx="16" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="55" y="685" font-size="18" font-weight="700" fill="#1F2937">No container needed</text>
    <text x="55" y="709" font-size="14" fill="#4B5563">Just space and align the content</text>
  </g>
</svg>
