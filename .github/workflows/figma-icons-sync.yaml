name: 🎨 Sync Figma Assets

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - figma-library-publish

concurrency:
  group: figma-assets-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Spirit Assets
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'figma-library-publish' &&
      github.event.client_payload.file_key == 'UMd06VnGrAE5xheb4C8QEg')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-install

      - name: Sync assets from Figma
        run: yarn icons:sync
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}

      - name: Open or update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/figma-icons-sync
          delete-branch: true
          commit-message: 'chore(icons): sync icons from Figma'
          title: 'Chore(icons): Sync icons from Figma'
          body: |
            ## Summary

            - synchronize Spirit SVG assets directly from the Figma Assets file
            - add, update, or remove icons and illustrations to match the configured `Brand=Spirit` variants

            This pull request is managed by the Figma asset sync workflow.
          add-paths: |
            packages/icons/src/svg
            packages/icons/src/illustrations
