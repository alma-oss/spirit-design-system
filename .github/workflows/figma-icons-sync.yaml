name: 🎨 Sync Figma Assets

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - figma-library-publish

concurrency:
  group: figma-assets-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Spirit Assets
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'figma-library-publish' &&
      github.event.client_payload.file_key == 'UMd06VnGrAE5xheb4C8QEg')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-install

      - name: Sync assets from Figma
        run: yarn icons:sync
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}

      - name: Read Figma publish notes
        id: figma-notes
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          FIGMA_FILE_KEY: UMd06VnGrAE5xheb4C8QEg
        run: |
          NOTES=""
          if RESPONSE="$(curl -fsS -H "X-Figma-Token: ${FIGMA_ACCESS_TOKEN}" \
            "https://api.figma.com/v1/files/${FIGMA_FILE_KEY}/versions")"; then
            NOTES="$(printf '%s' "$RESPONSE" | node --input-type=module -e '
              const chunks = [];
              process.stdin.on("data", (chunk) => chunks.push(chunk));
              process.stdin.on("end", () => {
                try {
                  const json = JSON.parse(Buffer.concat(chunks).toString("utf8"));
                  const description = json?.versions?.[0]?.description;
                  if (typeof description === "string" && description.trim()) {
                    process.stdout.write(description.trim());
                  }
                } catch {
                  // Missing or invalid version metadata must not fail the sync.
                }
              });
            ')" || true
          fi

          {
            echo "body<<PRBODY"
            echo "## Summary"
            echo ""
            echo "- synchronize Spirit SVG icons directly from the Figma Assets file"
            echo "- add, update, or remove icons to match the configured \`Brand=Spirit\` variants"
            echo ""
            if [ -n "$NOTES" ]; then
              echo "## Figma Publish Notes"
              echo ""
              echo "$NOTES"
              echo ""
            fi
            echo "This pull request is managed by the Figma asset sync workflow."
            echo "PRBODY"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/figma-icons-sync
          delete-branch: true
          commit-message: 'chore(icons): sync icons from Figma'
          title: 'Chore(icons): Sync icons from Figma'
          body: ${{ steps.figma-notes.outputs.body }}
          add-paths: |
            packages/icons/src/svg
