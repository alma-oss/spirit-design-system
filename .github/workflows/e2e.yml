name: 🤖 End-to-End Tests
on:
  workflow_call:

env:
  NODE_ENV: testing

jobs:
  deploy:
    name: 🚀 Deploy to Netlify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      url: ${{ steps.netlify-deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-install

      # Reuse the demo app built by the Build job instead of building it again
      - name: Download demo app build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: demo-build
          path: apps/demo/build/

      # The CLI is synchronous, returns the exact deploy URL (no SHA lookup race) and exits non-zero
      # on a deploy failure, so infra problems fail here and not in the test job.
      - name: Deploy to Netlify
        id: netlify-deploy
        run: |
          DEPLOY_JSON=$(yarn netlify deploy \
            --dir apps/demo/build \
            --no-build \
            --message "E2E ${GITHUB_SHA}" \
            --json)
          echo "$DEPLOY_JSON"
          DEPLOY_URL=$(echo "$DEPLOY_JSON" | jq -r '.deploy_url // empty')
          if [ -z "$DEPLOY_URL" ]; then
            echo "Netlify CLI did not return a deploy URL."
            exit 1
          fi
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_SPIRIT_DESIGN_SYSTEM }}

      - name: Notify Slack when deploy failed
        if: failure()
        uses: slackapi/slack-github-action@fcfb566f8b0aab22203f066d80ca1d7e4b5d05b3 # v1.27.1
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": "${{ github.ref == 'refs/heads/main' && 'Hey <!channel>,' || 'Hey,' }} :warning: E2E tests could not run on `${{ github.ref }}` — the Netlify deploy failed (infrastructure, not a test regression). <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open failed GitHub Action>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFICATIONS_TOKEN }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  test:
    name: 🖥️ End-to-End Testing
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-install

      - name: Get Playwright Version
        id: playwright-version
        run: |
          PW_VERSION=$(yq '.catalogs.test["@playwright/test"]' .yarnrc.yml)
          echo "version=$PW_VERSION" >> $GITHUB_OUTPUT

      - name: Run Playwright tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            -e CI="true" \
            -e NODE_ENV="${{ env.NODE_ENV }}" \
            -e PW_WORKERS="${{ vars.PW_WORKERS || '1' }}" \
            -e PW_PAGE_RETRIES="${{ vars.PW_PAGE_RETRIES || '5' }}" \
            -e WEBSITE_URL="${{ needs.deploy.outputs.url }}" \
            mcr.microsoft.com/playwright:v${{ steps.playwright-version.outputs.version }}-noble \
            sh -c "corepack install && corepack enable && yarn test:e2e"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        id: artifact-upload-step
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Comment PR with artifact URL
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const issue_number = context.issue.number;
            const repo = context.repo.repo;
            const owner = context.repo.owner;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `Here is the URL of the uploaded artifact: ${{ steps.artifact-upload-step.outputs.artifact-url }}`
            });
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Notify Slack when failure
        id: Slack
        uses: slackapi/slack-github-action@fcfb566f8b0aab22203f066d80ca1d7e4b5d05b3 # v1.27.1
        if: failure()
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }} # Slack channel-id of #spirit-design-system-notifications_en
          payload: |
            {
              "attachments": [
                {
                  "color": "#ff0000",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": ":boom: GitHub Action failed",
                        "emoji": true
                      }
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*${{ github.ref == 'refs/heads/main' && 'Hey <!channel>,' || 'Hey,' }} E2E tests just failed on:* `${{ github.ref }}`!\n\n*Pull request title:* `${{ github.event.pull_request.title }}`"
                      }
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*E2E tests result:* `${{ job.status }}`"
                      }
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": ":github: Open Pull request"
                          },
                          "url": "${{ github.event.pull_request.html_url }}"
                        },
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": ":github: Open failed GitHub Action"
                          },
                          "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        },
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": ":github: Download Report"
                          },
                          "url": "${{ steps.artifact-upload-step.outputs.artifact-url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFICATIONS_TOKEN }} # Webhook from Slack Application
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
