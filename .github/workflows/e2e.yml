name: 🤖 End-to-End Tests
on:
  workflow_call:
    inputs:
      url:
        description: 'URL of the deployed demo app to run the tests against'
        required: true
        type: string

env:
  NODE_ENV: testing

jobs:
  test:
    name: 🖥️ End-to-End Testing
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-install

      - name: Get Playwright Version
        id: playwright-version
        run: |
          PW_VERSION=$(yq '.catalogs.test["@playwright/test"]' .yarnrc.yml)
          echo "version=$PW_VERSION" >> $GITHUB_OUTPUT

      - name: Run Playwright tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            -e CI="true" \
            -e NODE_ENV="${{ env.NODE_ENV }}" \
            -e PW_WORKERS="${{ vars.PW_WORKERS || '1' }}" \
            -e PW_PAGE_RETRIES="${{ vars.PW_PAGE_RETRIES || '5' }}" \
            -e WEBSITE_URL="${{ inputs.url }}" \
            mcr.microsoft.com/playwright:v${{ steps.playwright-version.outputs.version }}-noble \
            sh -c "corepack install && corepack enable && yarn test:e2e"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        id: artifact-upload-step
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Comment PR with artifact URL
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const issue_number = context.issue.number;
            const repo = context.repo.repo;
            const owner = context.repo.owner;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `Here is the URL of the uploaded artifact: ${{ steps.artifact-upload-step.outputs.artifact-url }}`
            });
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Notify Slack when failure
        id: Slack
        uses: slackapi/slack-github-action@fcfb566f8b0aab22203f066d80ca1d7e4b5d05b3 # v1.27.1
        if: failure()
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }} # Slack channel-id of #spirit-design-system-notifications_en
          payload: |
            {
              "attachments": [
                {
                  "color": "#ff0000",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": ":boom: GitHub Action failed",
                        "emoji": true
                      }
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*${{ github.ref == 'refs/heads/main' && 'Hey <!channel>,' || 'Hey,' }} E2E tests just failed on:* `${{ github.ref }}`!\n\n*Pull request title:* `${{ github.event.pull_request.title }}`"
                      }
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*E2E tests result:* `${{ job.status }}`"
                      }
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": ":github: Open Pull request"
                          },
                          "url": "${{ github.event.pull_request.html_url }}"
                        },
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": ":github: Open failed GitHub Action"
                          },
                          "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        },
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": ":github: Download Report"
                          },
                          "url": "${{ steps.artifact-upload-step.outputs.artifact-url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFICATIONS_TOKEN }} # Webhook from Slack Application
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
