name: 🎨 Sync Assets

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - figma-library-publish

concurrency:
  group: figma-assets-sync
  cancel-in-progress: false

jobs:
  discover:
    name: Discover sync targets
    runs-on: ubuntu-24.04
    environment: figma
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      has-targets: ${{ steps.discover.outputs.has-targets }}
      matrix: ${{ steps.discover.outputs.matrix }}

    steps:
      - name: Checkout Spirit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-install

      - name: Discover opted-in repositories
        id: discover
        env:
          DISPATCH_FILE_KEY: ${{ github.event.client_payload.file_key }}
          GH_APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
        run: yarn workspace @alma-oss/spirit-assets-exporter discover

  sync:
    name: Sync Figma Assets (${{ matrix.owner }}/${{ matrix.repo }} / ${{ matrix.brand }})
    needs: discover
    if: ${{ needs.discover.outputs.has-targets == 'true' }}
    runs-on: ubuntu-24.04
    environment: figma
    timeout-minutes: 15
    concurrency:
      group: figma-assets-sync-${{ matrix.owner }}-${{ matrix.repo }}-${{ matrix.slug }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    permissions:
      contents: read

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout Spirit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ matrix.owner }}/${{ matrix.repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: target

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-install

      - name: Sync assets from Figma
        run: >
          yarn workspace @alma-oss/spirit-assets-exporter sync
          --config target/spirit.config.json
          --repository-root target
          --brand "${{ matrix.brand }}"
          --out "${{ matrix.out }}"
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}

      - name: Read Figma publish notes
        id: figma-notes
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          DISPATCH_DESCRIPTION: ${{ github.event.client_payload.description }}
          BRAND: ${{ matrix.brand }}
          FIGMA_FILE_KEY: ${{ matrix.fileKey }}
        run: |
          NOTES="$(yarn workspace @alma-oss/spirit-assets-exporter read-publish-notes)"

          if [ -z "$NOTES" ]; then
            HTTP_CODE="$(curl -sS -o /tmp/figma-versions.json -w '%{http_code}' \
              -H "X-Figma-Token: ${FIGMA_ACCESS_TOKEN}" \
              "https://api.figma.com/v1/files/${FIGMA_FILE_KEY}/versions" || true)"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "::warning::Figma versions API returned HTTP ${HTTP_CODE}. Grant file_versions:read on FIGMA_ACCESS_TOKEN, or forward the library publish description as repository_dispatch client_payload.description."
            else
              NOTES="$(yarn workspace @alma-oss/spirit-assets-exporter read-publish-notes /tmp/figma-versions.json)"
            fi
          fi

          {
            echo "body<<PRBODY"
            echo "## Summary"
            echo ""
            echo "- synchronize ${BRAND} SVG icons directly from the Figma Assets file"
            echo "- add, update, or remove icons to match the configured \`Brand=${BRAND}\` variants"
            echo ""
            if [ -n "$NOTES" ]; then
              echo "## Figma Publish Notes"
              echo ""
              echo "$NOTES"
              echo ""
            fi
            echo "This pull request is managed by the Figma asset sync workflow in alma-oss/spirit-design-system."
            echo "PRBODY"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: target
          branch: chore/figma-icons-sync-${{ matrix.slug }}
          delete-branch: true
          commit-message: 'chore(icons): sync ${{ matrix.brand }} icons from Figma'
          title: 'Chore(icons): Sync ${{ matrix.brand }} icons from Figma'
          body: ${{ steps.figma-notes.outputs.body }}
          add-paths: |
            ${{ matrix.out }}
