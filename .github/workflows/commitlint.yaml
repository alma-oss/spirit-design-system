name: 🔍 Commit Checks

on:
  push:
    branches-ignore:
      - main

jobs:
  commitlint:
    name: 🧾 Linting Commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-install

      - name: Run Commitlint
        run: yarn lint:commit
