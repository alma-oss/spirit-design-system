name: 🔍 Commit Checks

on:
  push:
    branches-ignore:
      - main

jobs:
  commitlint:
    name: 🧾 Linting Commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-install

      - name: Run Commitlint
        run: yarn lint:commit
