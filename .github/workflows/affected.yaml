name: 🎯 Affected

# Computes which apps are affected by the current change, using Nx's project graph, and decides whether the
# deploy → e2e chain should run. The outputs let downstream jobs run only for what changed: the `build` job builds
# only the affected apps and the deploy → e2e chain gates on `e2e`.
#
# The deploy and E2E tests run (`e2e`) when:
#   - the commit is on `main` (always: the deploy there is the production one, so it is never skipped)
#   - or the pull request is not from a fork (forks do not receive the Netlify secrets), the demo app is affected
#     (or e2e infrastructure changed) and it is labeled `run-visual-tests` or changes anything in `tests/e2e`
# The scheduled run never deploys.

on:
  workflow_call:
    outputs:
      demo:
        description: 'Whether the demo app is affected (or e2e infrastructure changed)'
        value: ${{ jobs.affected.outputs.demo }}
      e2e:
        description: 'Whether the deploy and E2E tests should run'
        value: ${{ jobs.affected.outputs.e2e }}
      docsite:
        description: 'Whether the docsite app is affected'
        value: ${{ jobs.affected.outputs.docsite }}
      storybook:
        description: 'Whether the storybook app is affected'
        value: ${{ jobs.affected.outputs.storybook }}
      examples:
        description: 'Whether any of the Next.js example apps is affected'
        value: ${{ jobs.affected.outputs.examples }}

permissions:
  contents: read
  # nx-set-shas reads the last successful run of the calling workflow to derive the base SHA on `main`
  actions: read

env:
  NX_NO_CLOUD: true

jobs:
  affected:
    name: 🎯 Computing Affected Projects
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      demo: ${{ steps.calc.outputs.demo }}
      e2e: ${{ steps.calc.outputs.e2e }}
      docsite: ${{ steps.calc.outputs.docsite }}
      storybook: ${{ steps.calc.outputs.storybook }}
      examples: ${{ steps.calc.outputs.examples }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `nx affected` and the path-override diff need full history to resolve the base
          fetch-depth: 0

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-install
        with:
          # Nx builds the project graph from the workspaces' package.json files, so only the root (`nx`) is needed
          focus: spirit

      - name: Resolve affected projects
        uses: ./.github/actions/nx-affected

      - name: Compute affected projects
        id: calc
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'run-visual-tests') }}
        run: |
          set -euo pipefail

          demo_note=''
          AFFECTED=$(yarn nx show projects --affected --base="$NX_BASE" --head="$NX_HEAD" -t build --json)
          jq -e 'type == "array"' <<<"$AFFECTED" >/dev/null
          echo "Affected projects (build target): $AFFECTED"
          # The Playwright setup, its tests, and the build and deploy pipeline are inputs of the demo's `e2e` target.
          E2E_AFFECTED=$(yarn nx show projects --affected --base="$NX_BASE" --head="$NX_HEAD" -t e2e --json)
          jq -e 'type == "array"' <<<"$E2E_AFFECTED" >/dev/null
          echo "Affected projects (e2e target): $E2E_AFFECTED"

          has() {
            if jq -e --arg p "$1" 'any(.[]; . == $p)' <<<"$AFFECTED" >/dev/null; then
              echo true
            else
              echo false
            fi
          }
          demo=$(has '@lmc-eu/spirit-demo-app')
          docsite=$(has '@alma-oss/spirit-docsite')
          storybook=$(has '@alma-oss/spirit-storybook')
          app_router=$(has '@alma-oss/spirit-example-next-with-app-router')
          pages_router=$(has '@alma-oss/spirit-example-next-with-pages-router')
          examples=false
          if [ "$app_router" = true ] || [ "$pages_router" = true ]; then
            examples=true
          fi

          if [ "$demo" = false ] && [ "$(jq -r 'any(.[]; . == "@lmc-eu/spirit-demo-app")' <<<"$E2E_AFFECTED")" = true ]; then
            demo=true
            demo_note=' (e2e infrastructure changed)'
          fi

          # Event policy. `main` always deploys: the deploy there is the production one, and a graph miss must not
          # leave it stale. Pull requests additionally need the demo to be affected; `tests/e2e/` changes already
          # mark the demo affected above.
          e2e=false
          if [ "$EVENT_NAME" = push ] && [ "$REF" = refs/heads/main ]; then
            e2e=true
          elif [ "$demo" = true ] && [ "$EVENT_NAME" = pull_request ] && [ "$HEAD_REPO" = "$REPOSITORY" ]; then
            if [ "$LABELED" = true ] || grep -E '^tests/e2e/' "$CHANGED_FILES" >/dev/null; then
              e2e=true
            fi
          fi

          {
            echo "demo=$demo"
            echo "e2e=$e2e"
            echo "docsite=$docsite"
            echo "storybook=$storybook"
            echo "examples=$examples"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### 🎯 Affected apps"
            echo ""
            echo "| App | Affected |"
            echo "| :-- | :-- |"
            echo "| Demo | \`$demo\`$demo_note |"
            echo "| Deploy + E2E | \`$e2e\` |"
            echo "| Docsite | \`$docsite\` |"
            echo "| Storybook | \`$storybook\` |"
            echo "| Next.js examples | \`$examples\` |"
            echo ""
            echo "<sub>base: \`${NX_BASE:-n/a}\` · head: \`${NX_HEAD:-n/a}\`</sub>"
          } >> "$GITHUB_STEP_SUMMARY"
