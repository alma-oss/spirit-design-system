name: 🎯 Affected

# Computes which apps are affected by the current change, using Nx's project graph.
# The outputs let downstream jobs run only for what changed. Today only the deploy → e2e chain
# gates on `demo`; the `build` job still builds every app.

on:
  workflow_call:
    outputs:
      demo:
        description: 'Whether the demo app is affected (or e2e infrastructure changed)'
        value: ${{ jobs.affected.outputs.demo }}
      docsite:
        description: 'Whether the docsite app is affected'
        value: ${{ jobs.affected.outputs.docsite }}
      storybook:
        description: 'Whether the storybook app is affected'
        value: ${{ jobs.affected.outputs.storybook }}
      examples:
        description: 'Whether any of the Next.js example apps is affected'
        value: ${{ jobs.affected.outputs.examples }}

permissions:
  contents: read
  # nx-set-shas reads the last successful run of the calling workflow to derive the base SHA on `main`
  actions: read

env:
  NX_NO_CLOUD: true

jobs:
  affected:
    name: 🎯 Computing Affected Projects
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      demo: ${{ steps.calc.outputs.demo }}
      docsite: ${{ steps.calc.outputs.docsite }}
      storybook: ${{ steps.calc.outputs.storybook }}
      examples: ${{ steps.calc.outputs.examples }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `nx affected` and the path-override diff need full history to resolve the base
          fetch-depth: 0

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-install

      # Sets NX_BASE / NX_HEAD. On a PR it is the merge-base with the target branch; on a push
      # to `main` it is the last successful run of the calling CI workflow (HEAD~1 when there is none).
      # The scheduled run has no meaningful base, it treats everything as affected.
      - name: Derive base and head SHAs
        if: github.event_name != 'schedule'
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: Compute affected projects
        id: calc
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Changes outside any Nx project that still alter what the apps build or how they are checked.
          # Nx maps none of them to a project, so they would otherwise mark nothing affected.
          GLOBAL_PATTERN='^(package\.json|\.nvmrc|\.yarnrc\.yml|\.github/actions/|\.github/workflows/(affected|build|continuous-integration)\.ya?ml$)'
          # The Playwright setup and its deploy target are not part of any project either.
          E2E_PATTERN='^(tests/|playwright\.config\.|\.github/workflows/(e2e|deploy)\.ya?ml$)'

          all=false
          demo_note=''
          changed=''
          if [ "$EVENT_NAME" = schedule ]; then
            all=true
          else
            # Collected before matching: `grep -q` closing the pipe early would fail the pipeline.
            changed=$(git diff --name-only "$NX_BASE" "$NX_HEAD")
            if grep -E "$GLOBAL_PATTERN" <<<"$changed" >/dev/null; then
              all=true
            fi
          fi

          # Fail closed: an unparsable result must stop the run, not report every app as unaffected.
          AFFECTED='[]'
          if [ "$all" = false ]; then
            AFFECTED=$(yarn nx show projects --affected --base="$NX_BASE" --head="$NX_HEAD" -t build --json)
            jq -e 'type == "array"' <<<"$AFFECTED" >/dev/null
            echo "Affected projects (build target): $AFFECTED"
          fi

          has() {
            if [ "$all" = true ] || jq -e --arg p "$1" 'any(.[]; . == $p)' <<<"$AFFECTED" >/dev/null; then
              echo true
            else
              echo false
            fi
          }
          demo=$(has '@lmc-eu/spirit-demo-app')
          docsite=$(has '@alma-oss/spirit-docsite')
          storybook=$(has '@alma-oss/spirit-storybook')
          app_router=$(has '@alma-oss/spirit-example-next-with-app-router')
          pages_router=$(has '@alma-oss/spirit-example-next-with-pages-router')
          examples=false
          if [ "$app_router" = true ] || [ "$pages_router" = true ]; then
            examples=true
          fi

          if [ "$all" = true ]; then
            demo_note=' (everything affected)'
          elif [ "$demo" = false ] && grep -E "$E2E_PATTERN" <<<"$changed" >/dev/null; then
            demo=true
            demo_note=' (e2e-infra override)'
          fi

          {
            echo "demo=$demo"
            echo "docsite=$docsite"
            echo "storybook=$storybook"
            echo "examples=$examples"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### 🎯 Affected apps"
            echo ""
            echo "| App | Affected |"
            echo "| :-- | :-- |"
            echo "| Demo | \`$demo\`$demo_note |"
            echo "| Docsite | \`$docsite\` |"
            echo "| Storybook | \`$storybook\` |"
            echo "| Next.js examples | \`$examples\` |"
            echo ""
            echo "<sub>base: \`${NX_BASE:-n/a}\` · head: \`${NX_HEAD:-n/a}\`</sub>"
          } >> "$GITHUB_STEP_SUMMARY"
