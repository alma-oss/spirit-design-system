name: 🏗️ Build

on:
  workflow_call:

permissions:
  actions: write
  contents: read

env:
  NX_BRANCH: ${{ github.event.number || github.ref_name }}
  NX_VERBOSE_LOGGING: true
  NX_NO_CLOUD: true
  NX_MAX_CACHE_SIZE: 1GB
  CACHE_KEY: repository-cache-key-${{ github.run_id }}

jobs:
  build:
    name: 👷 Building on Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        # minimum required, current LTS, and next active release line
        node-version: [22, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup and Install
        uses: ./.github/actions/setup-install
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore Nx cache
        id: nx_cache
        uses: ./.github/actions/nx-cache
        with:
          scope: build
          node-major: ${{ matrix.node-version }}

      - name: Build packages
        run: yarn build

      - name: Check for clean working directory
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Error: Git working directory is not clean"
            git status
            exit 1
          fi

      - name: Save Nx cache
        uses: ./.github/actions/nx-cache-save
        with:
          cache-key: ${{ steps.nx_cache.outputs.cache-key }}
          key-prefix: nx-${{ runner.os }}-node${{ matrix.node-version }}-build-

      # Node 22 is the minimum supported version; lint.yaml restores this cache to reuse
      # the already-built workspace packages instead of building them again.
      - name: Save Repository to Cache
        if: matrix.node-version == 22
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ./
          key: ${{ env.CACHE_KEY }}
