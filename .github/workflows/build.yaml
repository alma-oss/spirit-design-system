name: 🏗️ Build

on:
  workflow_call:
    inputs:
      build-demo:
        description: 'Build the demo app and upload it as an artifact, even when it is not affected (for the Deploy workflow)'
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

env:
  NX_BRANCH: ${{ github.event.number || github.ref_name }}
  NX_VERBOSE_LOGGING: true
  NX_NO_CLOUD: true
  NX_MAX_CACHE_SIZE: 1GB
  # Keep the Nx cache and its task index in the workspace so they can be saved and restored.
  NX_CACHE_DIRECTORY: .nx/cache
  NX_WORKSPACE_DATA_DIRECTORY: .nx/workspace-data

jobs:
  build:
    name: 👷 Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `nx affected` needs the full history to resolve the base
          fetch-depth: 0

      - name: Setup and Install
        uses: ./.github/actions/setup-install

      - name: Resolve affected projects
        uses: ./.github/actions/nx-affected

      - name: Restore Nx cache
        id: nx_cache
        uses: ./.github/actions/nx-cache
        with:
          scope: build

      - name: Build packages
        run: yarn build:packages:affected

      - name: Build apps
        run: yarn build:apps:affected

      # The Deploy workflow ships this build whether or not the app is affected, so make sure it exists.
      # It is replayed from the Nx cache when the step above has built it already.
      - name: Build demo app
        if: ${{ inputs.build-demo }}
        run: yarn nx run @lmc-eu/spirit-demo-app:build

      - name: Check for clean working directory
        uses: ./.github/actions/check-clean-tree

      # The demo build is shared with the Deploy workflow, so it is not built again
      - name: Cache App Build (demo)
        if: ${{ inputs.build-demo }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: demo-build
          path: apps/demo/build/
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error

      - name: Save Nx cache
        uses: ./.github/actions/nx-cache-save
        with:
          cache-key: ${{ steps.nx_cache.outputs.cache-key }}
          key-prefix: nx-${{ runner.os }}-node22-build-

  build-compat:
    name: 🧬 Build packages on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        # current LTS and next active release line, the minimum required version is covered by `build`
        node-version: [24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `nx affected` needs the full history to resolve the base
          fetch-depth: 0

      - name: Setup and Install
        uses: ./.github/actions/setup-install
        with:
          node-version: ${{ matrix.node-version }}

      - name: Resolve affected projects
        uses: ./.github/actions/nx-affected

      # The Nx cache is intentionally neither restored nor saved: Nx does not hash the Node.js version,
      # so a cache hit would skip the very compatibility check this job exists for.
      - name: Build packages
        run: yarn build:packages:affected --skip-nx-cache

      - name: Check for clean working directory
        uses: ./.github/actions/check-clean-tree
