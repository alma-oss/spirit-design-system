name: 🏗️ Build

on:
  workflow_call:

env:
  NX_BRANCH: ${{ github.event.number || github.ref_name }}
  NX_VERBOSE_LOGGING: true
  NX_NO_CLOUD: true

jobs:
  build:
    name: 👷 Building on Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        # minimum required, current LTS, and next active release line
        node-version: [22, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup and Install
        uses: ./.github/actions/setup-install
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build packages
        run: yarn build

      - name: Check for clean working directory
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Error: Git working directory is not clean"
            git status
            exit 1
          fi

  build-apps:
    name: 📦 Building ${{ matrix.app.title }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app:
          - { title: 'Demo', package: '@lmc-eu/spirit-demo-app', artifact: 'demo-build', path: 'apps/demo/build/' }
          - { title: 'Docsite', package: '@alma-oss/spirit-docsite' }
          - { title: 'Storybook', package: '@alma-oss/spirit-storybook' }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup and Install
        uses: ./.github/actions/setup-install

      - name: Build app
        run: yarn nx run ${{ matrix.app.package }}:build

      # Only the demo app is deployed (and E2E tested), so its build is shared with the Deploy workflow
      - name: Upload app build
        if: matrix.app.artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.app.artifact }}
          path: ${{ matrix.app.path }}
          retention-days: 1
          if-no-files-found: error
