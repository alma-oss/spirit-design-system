name: 🏗️ Build

on:
  workflow_call:
    inputs:
      build-demo:
        description: 'Build the demo app and upload it as the `demo-build` artifact (used by E2E tests)'
        required: false
        type: boolean
        default: false

env:
  NX_BRANCH: ${{ github.event.number || github.ref_name }}
  NX_VERBOSE_LOGGING: true
  NX_NO_CLOUD: true

jobs:
  build:
    name: 👷 Building on Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        # minimum required, current LTS, and next active release line
        node-version: [22, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup and Install
        uses: ./.github/actions/setup-install
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build packages
        run: yarn build

      # Built once on the Node.js version used by Netlify and reused by the E2E deploy job
      - name: Build demo app
        if: inputs.build-demo && matrix.node-version == 22
        run: yarn nx run @lmc-eu/spirit-demo-app:build

      - name: Upload demo app build
        if: inputs.build-demo && matrix.node-version == 22
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: demo-build
          path: apps/demo/build/
          retention-days: 1
          if-no-files-found: error

      - name: Check for clean working directory
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Error: Git working directory is not clean"
            git status
            exit 1
          fi
