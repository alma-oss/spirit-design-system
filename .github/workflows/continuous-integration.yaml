name: 🔄 CI

on:
  # Post-merge CI on main; pull_request covers everything else (including PRs into release branches)
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '0 9 * * *' # every day at 9:00

permissions:
  contents: read
  # Allows coveralls to post coverage reports as PR comments
  # Enables updating PR description with coverage badges
  # Required for PR status checks
  pull-requests: write
  # Allows coveralls to create/update check runs
  # Enables the coverage status to appear in the PR checks section
  # Required for passing/failing the coverage check
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  git-checks:
    name: 🚦 Git Checks
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/git.yaml

  build:
    name: 🏗️ Build
    uses: ./.github/workflows/build.yaml
    permissions:
      actions: write
      contents: read

  announce-deploy:
    name: 📣 Announce Deploy
    # Only when the deploy can follow, otherwise the comment would stay in progress forever
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-visual-tests') && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/announce-deploy.yaml
    secrets: inherit

  announce-deploy-skipped:
    name: 📣 Announce Deploy Skipped
    needs: [build, announce-deploy]
    # The deploy never starts after a failed or cancelled build, so close the announced comment here
    if: ${{ always() && needs.announce-deploy.result == 'success' && needs.build.result != 'success' }}
    uses: ./.github/workflows/announce-deploy.yaml
    with:
      state: skipped
    secrets: inherit

  deploy:
    name: 🚀 Deploy
    needs: [build, announce-deploy]
    # Same trigger as the E2E tests it serves; fork pull requests do not receive the Netlify secrets.
    # The announcement is optional: a skipped (main) or failed one must not block the deploy
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'schedule' && (github.ref == 'refs/heads/main' || (contains(github.event.pull_request.labels.*.name, 'run-visual-tests') && github.event.pull_request.head.repo.full_name == github.repository)) }}
    uses: ./.github/workflows/deploy.yaml
    secrets: inherit

  e2e-tests:
    name: 🤖 End-to-End Tests
    needs: deploy
    # Runs on main and on PRs labeled `run-visual-tests`
    if: github.event_name != 'schedule' && (github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'run-visual-tests'))
    uses: ./.github/workflows/e2e.yml
    with:
      url: ${{ needs.deploy.outputs.url }}
    secrets: inherit

  docs-reviews:
    name: 📄 Docs Reviews
    uses: ./.github/workflows/docs-review.yaml

  code-quality-checks:
    name: 🔍 Code Quality Checks
    uses: ./.github/workflows/lint.yaml
    permissions:
      actions: write
      contents: read

  tests:
    name: 🧪 Tests
    uses: ./.github/workflows/test.yaml

  code-quality-gate:
    name: 📊 Code Quality Gate
    needs: [code-quality-checks, tests, docs-reviews]
    if: always()
    uses: ./.github/workflows/gate.yaml
    with:
      needs-context: ${{ toJSON(needs) }}
      gate-name: '📊 Code Quality Gate'

  ready-to-integrate:
    name: 🚢 Ready to Integrate
    needs: [git-checks, build, deploy, e2e-tests, code-quality-gate]
    if: always()
    uses: ./.github/workflows/gate.yaml
    with:
      needs-context: ${{ toJSON(needs) }}
      gate-name: '🚢 Ready to Integrate'
