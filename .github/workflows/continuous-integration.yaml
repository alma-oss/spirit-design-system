name: 🔄 CI

on:
  # Post-merge CI on main; pull_request covers everything else (including PRs into release branches)
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '0 9 * * *' # every day at 9:00

permissions:
  contents: read
  # Allows coveralls to post coverage reports as PR comments
  # Enables updating PR description with coverage badges
  # Required for PR status checks
  pull-requests: write
  # Allows coveralls to create/update check runs
  # Enables the coverage status to appear in the PR checks section
  # Required for passing/failing the coverage check
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  git-checks:
    name: 🚦 Git Checks
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/git.yaml

  build:
    name: 🏗️ Build
    uses: ./.github/workflows/build.yaml
    permissions:
      actions: write
      contents: read

  e2e-changes:
    name: 🔎 E2E Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      # Lists files through the API, so no checkout is needed and rebased branches are compared against the current base
      - name: Detect changes in tests/e2e
        id: filter
        run: |
          if gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' | grep -q '^tests/e2e/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    name: 🚀 Deploy
    needs: [build, e2e-changes]
    # Same trigger as the E2E tests it serves; fork pull requests do not receive the Netlify secrets
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'schedule' && (github.ref == 'refs/heads/main' || ((contains(github.event.pull_request.labels.*.name, 'run-visual-tests') || needs.e2e-changes.outputs.changed == 'true') && github.event.pull_request.head.repo.full_name == github.repository)) }}
    uses: ./.github/workflows/deploy.yaml
    secrets: inherit

  e2e-tests:
    name: 🤖 End-to-End Tests
    needs: [deploy, e2e-changes]
    # Runs on main, on PRs labeled `run-visual-tests` and on PRs that change anything in `tests/e2e` (e.g. snapshots)
    if: ${{ !cancelled() && needs.deploy.result == 'success' && github.event_name != 'schedule' && (github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'run-visual-tests') || needs.e2e-changes.outputs.changed == 'true') }}
    uses: ./.github/workflows/e2e.yml
    with:
      url: ${{ needs.deploy.outputs.url }}
    secrets: inherit

  docs-reviews:
    name: 📄 Docs Reviews
    uses: ./.github/workflows/docs-review.yaml

  code-quality-checks:
    name: 🔍 Code Quality Checks
    uses: ./.github/workflows/lint.yaml
    permissions:
      actions: write
      contents: read

  tests:
    name: 🧪 Tests
    uses: ./.github/workflows/test.yaml

  code-quality-gate:
    name: 📊 Code Quality Gate
    needs: [code-quality-checks, tests, docs-reviews]
    if: always()
    uses: ./.github/workflows/gate.yaml
    with:
      needs-context: ${{ toJSON(needs) }}
      gate-name: '📊 Code Quality Gate'

  ready-to-integrate:
    name: 🚢 Ready to Integrate
    needs: [git-checks, build, e2e-changes, deploy, e2e-tests, code-quality-gate]
    if: always()
    uses: ./.github/workflows/gate.yaml
    with:
      needs-context: ${{ toJSON(needs) }}
      gate-name: '🚢 Ready to Integrate'
