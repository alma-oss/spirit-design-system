name: 📄 Documentation Review

on:
  workflow_call:

jobs:
  markdown-link-check:
    name: 🔗 Checking Markdown Links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore link check cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # External hosts flake. Report broken links in the job summary
          # without blocking the quality gate.
          fail: false
          args: --config .github/lychee.toml './**/*.md'

  markdown-lint:
    name: 📝 Linting Markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-install

      - name: Check File Format
        run: yarn lint:markdown
