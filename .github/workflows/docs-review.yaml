name: 📄 Documentation Review

on:
  # Run this workflow on push to branches only (not tags)
  push:
    branches:
      - '**'
  schedule:
    - cron: '0 9 * * *' # every day at 9:00

jobs:
  markdown-link-check:
    name: 🔗 Checking Markdown Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068 # v1.1.3
        with:
          use-quiet-mode: 'yes' # only show errors in output
          use-verbose-mode: 'yes'
          config-file: '.github/markdown-link-check-config.json'
        continue-on-error: true

  markdown-lint:
    name: 📝 Linting Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-install

      - name: Check File Format
        run: yarn lint:markdown
