name: 🚢 Publish

on:
  workflow_call:
    inputs:
      ref:
        description: 'Release commit to publish; empty checks out the triggering commit'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  has-tags:
    name: 🏷️ Analyze Tags
    runs-on: ubuntu-24.04

    outputs:
      has-tag: ${{ steps.check-tag-exists.outputs.has-tag }}

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          # Even though this is set, shallow clones do not always retrieve all tags correctly
          fetch-tags: true
          # So we need to fetch full history, including all tags
          fetch-depth: 0

      - name: Check Tag On Commit
        id: check-tag-exists
        uses: ./.github/actions/has-tags

  # TODO(DS-1102): npm validates the *calling* workflow file for Trusted Publishing, which is now `release.yaml`.
  #  Before the first release, change the Trusted Publisher workflow filename from `publish.yaml`
  #  to `release.yaml` on npmjs.com for every published package (package → Settings → Publishing access),
  #  otherwise `lerna publish` fails with a 404/ENEEDAUTH error.
  publish:
    name: 📦 Publish Packages
    needs: has-tags
    if: ${{ needs.has-tags.outputs.has-tag == 'true' }}
    runs-on: ubuntu-24.04
    environment: npm-registry
    permissions:
      # create commits and releases
      contents: write
      # Required for OIDC
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: true

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          # Even though this is set, shallow clones do not always retrieve all tags correctly
          fetch-tags: true
          # So we need to fetch full history, including all tags
          fetch-depth: 0

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-install

      - name: Build
        run: yarn build

      - name: Publish
        run: make publish
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Post Changelog
        run: yarn post-changelog
        env:
          SLACK_CHANGELOG_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFICATIONS_WEBHOOK_URL }}
