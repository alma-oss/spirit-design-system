name: 🚀 Deploy

on:
  workflow_call:
    outputs:
      url:
        description: 'URL of the Netlify deploy of the demo app'
        value: ${{ jobs.deploy.outputs.url }}

jobs:
  deploy:
    name: 🚀 Deploying
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Netlify credentials (NETLIFY_TOKEN, NETLIFY_SITE_SPIRIT_DESIGN_SYSTEM) live in this environment
    environment:
      name: netlify
      # Shown as the "View deployment" link on the pull request
      url: ${{ steps.netlify-deploy.outputs.url }}
    permissions:
      contents: read
    outputs:
      url: ${{ steps.netlify-deploy.outputs.url }}
    steps:
      # Only the files needed to run the pinned Netlify CLI and the comment action are checked out, and no
      # dependencies are installed: `yarn dlx` fetches the CLI on its own, and the version comes from the
      # `script` catalog in .yarnrc.yml.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /.nvmrc
            /package.json
            /.yarnrc.yml
            /.github/actions/setup-node/
            /.github/actions/deploy-comment/
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: ./.github/actions/setup-node

      # Reuse the demo app built by the Build job instead of building it again.
      - name: Download demo app build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: demo-build
          path: build/

      # The CLI is synchronous, returns the exact deploy URL (no SHA lookup race) and exits non-zero
      # on a deploy failure, so infra problems fail here and not in the test job.
      # `catalog:script` pins the version (see .yarnrc.yml), there is a single place to bump it.
      - name: Deploy to Netlify
        id: netlify-deploy
        run: |
          ALIAS_ARGS=()
          if [ -n "$PR_NUMBER" ]; then
            ALIAS_ARGS=(--alias "deploy-preview-${PR_NUMBER}")
          fi
          OUTPUT=$(yarn dlx --quiet --package netlify-cli@catalog:script netlify deploy \
            --dir build \
            "${ALIAS_ARGS[@]}" \
            --message "E2E ${GITHUB_SHA}" \
            --json)
          echo "$OUTPUT"
          DEPLOY_URL=$(echo "$OUTPUT" | jq -r '.deploy_url // empty')
          if [ -z "$DEPLOY_URL" ]; then
            echo "Netlify CLI did not return a deploy URL."
            exit 1
          fi
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
        env:
          # Same URL shape as the Netlify deploy preview of a PR; empty on main, where the deploy URL is used
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_SPIRIT_DESIGN_SYSTEM }}

      - name: Generate GitHub App token
        id: app-token
        if: always() && github.event_name == 'pull_request'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      # It also replaces the Slack alert, a failed deploy is visible right on the PR.
      - name: Comment deploy result on PR
        if: always() && github.event_name == 'pull_request' && steps.app-token.outcome == 'success'
        uses: ./.github/actions/deploy-comment
        with:
          state: ${{ steps.netlify-deploy.outcome == 'success' && 'success' || 'failure' }}
          url: ${{ steps.netlify-deploy.outputs.url }}
          token: ${{ steps.app-token.outputs.token }}
