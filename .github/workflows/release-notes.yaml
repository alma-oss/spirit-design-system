name: 📝 Release Notes

on:
  workflow_call:
    inputs:
      ref:
        description: 'Release commit the notes are generated for'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  release-notes:
    name: 📝 Generate Release Notes
    runs-on: ubuntu-24.04

    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-tags: true
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          # The token is only handed to the steps that push, not left on disk while the model runs
          persist-credentials: false

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-install

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Setup git config
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Set Release Date
        run: echo "RELEASE_DATE=$(git log -1 --format=%as HEAD)" >> "$GITHUB_ENV"

      - name: Generate Release Notes
        uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The Spirit GitHub App token, so the action does not need an OIDC token for the Claude GitHub App
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: |
            Run the spirit:release-notes skill in CI mode for the release published on ${{ env.RELEASE_DATE }}
            (HEAD is the `chore(release): publish` commit). Write docs/release-notes/${{ env.RELEASE_DATE }}.md
            and docs/release-notes/.warnings.md. Do not commit or push.
          claude_args: --allowedTools "Read,Write,Edit,Bash(git log:*),Bash(git tag:*),Bash(git diff:*),Bash(git show:*)"

      - name: Open Pull Request
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          FILE="docs/release-notes/${RELEASE_DATE}.md"
          BRANCH="docs/release-notes-${RELEASE_DATE}"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          test -f "$FILE" || { echo "::error::$FILE was not generated"; exit 1; }
          WARNINGS=$(cat docs/release-notes/.warnings.md 2> /dev/null || echo "No warnings.")
          rm -f docs/release-notes/.warnings.md
          if git ls-remote --exit-code --heads "$REMOTE" "$BRANCH" > /dev/null; then
            echo "Branch $BRANCH already exists, reusing it."
          else
            git switch -c "$BRANCH"
            git add "$FILE"
            git commit -m "docs(repo): add ${RELEASE_DATE} release notes"
            git push "$REMOTE" "$BRANCH"
          fi
          # A re-run after a partial failure picks up the open PR instead of skipping it
          URL=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$URL" ] && ! gh pr list --head "$BRANCH" --state all --json url --jq '.[0].url // empty' | grep -q .; then
            URL=$(gh pr create --base main --head "$BRANCH" \
              --title "docs(repo): add ${RELEASE_DATE} release notes" \
              --body "## Description

          Automatically generated release notes for the ${RELEASE_DATE} release. Review the text and the warnings below before it is final.

          ### Additional context

          ${WARNINGS}

          ### Issue reference

          Generated by the Release workflow.")
          fi
          if [ -z "$URL" ]; then
            echo "::notice::Release notes for ${RELEASE_DATE} already have a closed or merged PR, nothing to do."
            exit 0
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Post Slack Canvas
        if: ${{ steps.pr.outputs.created == 'true' }}
        run: yarn post-release-notes "$PWD/docs/release-notes/${RELEASE_DATE}.md"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_RELEASE_CHANNEL_ID: ${{ secrets.SLACK_RELEASE_CHANNEL_ID }}
          RELEASE_NOTES_PR_URL: ${{ steps.pr.outputs.url }}
