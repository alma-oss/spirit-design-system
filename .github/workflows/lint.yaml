name: 🔍 Code Quality Checks

on:
  workflow_call:

permissions:
  actions: write
  contents: read

env:
  NX_BRANCH: ${{ github.event.number || github.ref_name }}
  NX_VERBOSE_LOGGING: true
  NX_NO_CLOUD: true
  NX_MAX_CACHE_SIZE: 1GB

jobs:
  lint:
    name: 📐 Code Linting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-install

      - name: Restore Nx cache
        id: nx_cache
        uses: ./.github/actions/nx-cache
        with:
          scope: lint

      - name: Lint
        run: yarn lint:script

      - name: Save Nx cache
        uses: ./.github/actions/nx-cache-save
        with:
          cache-key: ${{ steps.nx_cache.outputs.cache-key }}
          key-prefix: nx-${{ runner.os }}-node22-lint-

  types:
    name: 📘 Type Checking
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-install

      - name: Restore Nx cache
        id: nx_cache
        uses: ./.github/actions/nx-cache
        with:
          scope: types

      - name: Types Check
        run: yarn types

      - name: Save Nx cache
        uses: ./.github/actions/nx-cache-save
        with:
          cache-key: ${{ steps.nx_cache.outputs.cache-key }}
          key-prefix: nx-${{ runner.os }}-node22-types-

  format:
    name: 💅 Code Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-install

      - name: Check Code-Style Format
        run: yarn format:check
