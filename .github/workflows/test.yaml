name: 🧪 Tests

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  # nx-set-shas reads the last successful run of the calling workflow to derive the base SHA
  actions: read

env:
  NX_BRANCH: ${{ github.event.number || github.ref_name }}
  NX_VERBOSE_LOGGING: true
  NX_NO_CLOUD: true

jobs:
  unit-tests:
    name: 🧪 Unit Testing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `nx affected` needs the full history to resolve the base
          fetch-depth: 0

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-install

      - name: Resolve affected projects
        uses: ./.github/actions/nx-affected

      - name: Build
        run: yarn workspace @alma-oss/spirit-design-tokens build

      - name: Unit Tests
        run: yarn packages:test:unit:coverage:affected

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-reports
          path: |
            packages/web/.coverage/lcov.info
            packages/web-react/.coverage/lcov.info
            packages/analytics/.coverage/lcov.info
            packages/common/.coverage/lcov.info
            packages/codemods/.coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 1

  publish-coverage:
    name: 📊 Publish Code Coverage
    needs: [unit-tests]
    if: always()
    uses: ./.github/workflows/publish-coverage.yaml
