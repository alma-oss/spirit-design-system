name: 'check clean tree'
description: 'Fail when the working directory has uncommitted changes, e.g. generated files that were not committed.'

runs:
  using: 'composite'
  steps:
    - name: Check for clean working directory
      shell: bash
      run: |
        if [[ -n "$(git status --porcelain)" ]]; then
          echo "Error: Git working directory is not clean"
          git status
          exit 1
        fi
