name: 'deploy comment'
description: 'Create or update the single E2E deploy comment on the pull request. Same idea as the Netlify bot
  comment: one comment per PR, updated in place.'

inputs:
  state:
    description: 'pending, success, failure or skipped'
    required: true
  url:
    description: 'URL of the deploy, used for the success state'
    required: false
    default: ''
  token:
    description: 'Token allowed to write pull request comments'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Comment deploy state on PR
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      with:
        github-token: ${{ inputs.token }}
        script: |
          const marker = '<!-- spirit-e2e-deploy -->';
          const state = process.env.DEPLOY_STATE;
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const heading = {
            pending: '### ⏳ Deploy Preview in progress',
            success: '### ✅ Deploy Preview ready!',
            failure: '### ⚠️ Deploy Preview failed',
            skipped: '### ⏭️ Deploy Preview skipped',
          }[state];
          const lead = {
            pending: 'The demo app is built and deployed after the build checks pass.',
            success: `🌐 **Deploy Preview:** ${process.env.DEPLOY_URL}`,
            failure: 'E2E tests could not run: the deploy failed (infrastructure, not a test regression).',
            skipped: 'The build checks did not pass, so the demo app was not deployed.',
          }[state];
          const body = [
            marker,
            heading,
            '',
            lead,
            '',
            `🔍 [Latest deploy log](${runUrl})`,
          ].join('\n');

          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner,
            repo,
            issue_number,
          });
          const existing = comments.find((comment) => comment.body?.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }
      env:
        DEPLOY_STATE: ${{ inputs.state }}
        DEPLOY_URL: ${{ inputs.url }}
