<section class="py-900 py-tablet-1000">

  <div class="Container">

    <h2 class="docs-Heading">Default</h2>

    <div class="docs-Stack docs-Stack--start">

      <div
        class="Tooltip"
        data-spirit-element="tooltip"
      >
        <button
          type="button"
          class="ControlButton ControlButton--small ControlButton--symmetrical text-color-scheme dynamic-color-background-interactive accessibility-tap-target d-flex"
          aria-describedby="contextual-help-demo-default"
          data-spirit-toggle="tooltip"
          data-spirit-target="#contextual-help-demo-default"
        >
          <svg
            class="Icon"
            width="16"
            height="16"
            aria-hidden="true"
          >
            <use href="/assets/icons/svg/sprite.svg#info" />
          </svg>
          <span class="accessibility-hidden">More information about Languages</span>
        </button>
        <div
          id="contextual-help-demo-default"
          class="TooltipPopover color-scheme-on-neutral-basic is-hidden placement-top placement-controlled"
          data-spirit-placement="top"
          data-spirit-trigger="click, hover, focus"
        >
          Choose all languages you can use.
          <span
            class="TooltipPopover__arrow"
            data-spirit-element="arrow"
          ></span>
        </div>
      </div>

    </div>

  </div>

</section>

<section class="py-900 py-tablet-1000">

  <div class="Container">

    <h2 class="docs-Heading">Dismissible</h2>

    <div class="docs-Stack docs-Stack--start">

      <div
        class="Tooltip"
        data-spirit-element="tooltip"
      >
        <button
          type="button"
          class="ControlButton ControlButton--small ControlButton--symmetrical text-color-scheme dynamic-color-background-interactive accessibility-tap-target d-flex"
          aria-describedby="contextual-help-demo-help"
          data-spirit-toggle="tooltip"
          data-spirit-target="#contextual-help-demo-help"
        >
          <svg
            class="Icon"
            width="16"
            height="16"
            aria-hidden="true"
          >
            <use href="/assets/icons/svg/sprite.svg#help" />
          </svg>
          <span class="accessibility-hidden">What is a segment?</span>
        </button>
        <div
          id="contextual-help-demo-help"
          class="TooltipPopover TooltipPopover--dismissible color-scheme-on-neutral-basic is-hidden placement-top placement-controlled"
          data-spirit-placement="top"
          data-spirit-trigger="click, hover, focus"
        >
          Segments identify who your visitors are.
          <button
            type="button"
            class="ControlButton ControlButton--medium text-color-scheme dynamic-color-background-interactive accessibility-tap-target ControlButton--hasBackground dynamic-color-border ControlButton--symmetrical"
            data-spirit-dismiss="tooltip"
            data-spirit-target="#contextual-help-demo-help"
            aria-controls="contextual-help-demo-help"
            aria-expanded="true"
          >
            <svg
              class="Icon"
              width="24"
              height="24"
              aria-hidden="true"
            >
              <use href="/assets/icons/svg/sprite.svg#close" />
            </svg>
            <span class="accessibility-hidden">Close</span>
          </button>
          <span
            class="TooltipPopover__arrow"
            data-spirit-element="arrow"
          ></span>
        </div>
      </div>

    </div>

  </div>

</section>
