<!-- doc-preview-guides: vertical -->
<div class="FileUpload" style="width: 360px;">
  <div class="FileUploadInput has-drag-and-drop">
    <input
      type="file"
      id="card-file-upload"
      name="card-attachment"
      class="FileUploadInput__input"
      aria-label="Attachment"
      aria-describedby="card-file-upload-helper"
    />
    <div class="FileUploadInput__dropZone FileUploadInput__dropZone--compact">
      <div class="FileUploadInput__dropZoneContent">
        <label for="card-file-upload" class="FileUploadInput__dropZoneLabel">Upload your file <span class="FileUploadInput__dragAndDropLabel">or drag and drop here</span></label>
        <div id="card-file-upload-helper" class="HelperText">Max file size is 10 MB</div>
      </div>
      <div class="Button Button--primary Button--small" aria-hidden="true">Browse</div>
    </div>
  </div>
</div>
