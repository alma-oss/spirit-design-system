<fieldset class="border-0" style="width: 200px;">
  <legend class="accessibility-hidden">Options</legend>
  <div class="Flex Flex--noWrap Flex--alignmentXStretch Flex--alignmentYStretch Flex--vertical" style="--flex-spacing-y: var(--spirit-space-500);">
      <div class="Flex Flex--horizontal Flex--inline" style="--flex-spacing-x: var(--spirit-space-500);">
        <input type="checkbox" id="card-field-group-1" class="Checkbox" name="card-field-group-1" checked />
        <div>
          <label class="Label Label--medium cursor-pointer" for="card-field-group-1">Option 1</label>
        </div>
      </div>
      <div class="Flex Flex--horizontal Flex--inline" style="--flex-spacing-x: var(--spirit-space-500);">
        <input type="checkbox" id="card-field-group-2" class="Checkbox" name="card-field-group-2" />
        <div>
          <label class="Label Label--medium cursor-pointer" for="card-field-group-2">Option 2</label>
        </div>
      </div>
      <div class="Flex Flex--horizontal Flex--inline" style="--flex-spacing-x: var(--spirit-space-500);">
        <input type="checkbox" id="card-field-group-3" class="Checkbox" name="card-field-group-3" />
        <div>
          <label class="Label Label--medium cursor-pointer" for="card-field-group-3">Option 3</label>
        </div>
      </div>
  </div>
</fieldset>
