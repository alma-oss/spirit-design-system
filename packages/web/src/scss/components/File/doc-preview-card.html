<ul aria-label="File attachments" style="width: 280px;">
  <li class="File">
    <div class="File__preview bg-emotion-informative-subtle text-emotion-informative-basic">
      <svg class="Icon" width="20" height="20" aria-hidden="true">
        <use href="/assets/icons/svg/sprite.svg#file" />
      </svg>
    </div>
    <div class="File__content">
      <div class="File__text">
        <span class="File__name">Document.pdf</span>
        <span class="HelperText">8,5 kB</span>
      </div>

    <button type="button" class="ControlButton ControlButton--medium ControlButton--symmetrical ControlButton--hasBackground dynamic-color-border dynamic-color-background-interactive" aria-label="Remove file Document.pdf">
      <svg class="Icon" width="16" height="16" aria-hidden="true">
        <use href="/assets/icons/svg/sprite.svg#close" />
      </svg>
    </button>
  </li>
