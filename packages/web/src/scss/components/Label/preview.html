<section class="py-900 py-tablet-1000">

  <div class="Container">

    <h2 class="docs-Heading">Item Label with Item Component</h2>

    <div class="docs-Stack docs-Stack--start">

      <button
        type="button"
        class="Item"
      >
        <span class="Item__content" role="presentation">
          <span class="Label Label--medium element-stretched cursor-pointer">Item label</span>
        </span>
      </button>

      <button
        type="button"
        class="Item color-scheme-on-selected-subtle bg-color-scheme"
      >
        <span class="Item__content" role="presentation">
          <span class="Label Label--medium element-stretched cursor-pointer">Selected Item</span>
        </span>
        <span class="Item__slot" role="presentation">
          <svg
            class="Icon Icon--selected"
            width="24"
            height="24"
            aria-hidden="true"
          >
            <use href="/assets/icons/svg/sprite.svg#check-plain" />
          </svg>
        </span>
      </button>

      <button
        type="button"
        class="Item disabled text-color-scheme"
      >
        <span class="Item__content" role="presentation">
          <span class="Label Label--medium element-stretched Label--disabled">Disabled Item</span>
        </span>
      </button>

    </div>

  </div>

</section>
