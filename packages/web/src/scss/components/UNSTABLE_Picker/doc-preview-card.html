<div class="Stack Stack--spacing" style="--stack-spacing: var(--spirit-space-400); width: 280px;">
  <span class="Label Label--medium">Languages</span>
  <div class="InputContainer InputContainer--fill InputContainer--medium" role="group" aria-label="Languages">
    <div role="grid" aria-label="Selected languages" class="UNSTABLE_PickerSelection">
        <div role="row" aria-label="Spanish" class="Tag Tag--selected Tag--small color-scheme-on-selected-basic">
          <div role="gridcell" aria-colindex="1" class="d-contents">
            <span>Spanish</span>
            <button type="button" class="ControlButton ControlButton--xsmall ControlButton--symmetrical" tabindex="-1">
              <svg class="Icon" width="16" height="16" aria-hidden="true">
                <use href="/assets/icons/svg/sprite.svg#close" />
              </svg>
              <span class="accessibility-hidden">Remove Spanish</span>
            </button>
          </div>
        </div>
        <div role="row" aria-label="Czech" class="Tag Tag--selected Tag--small color-scheme-on-selected-basic">
          <div role="gridcell" aria-colindex="1" class="d-contents">
            <span>Czech</span>
            <button type="button" class="ControlButton ControlButton--xsmall ControlButton--symmetrical" tabindex="-1">
              <svg class="Icon" width="16" height="16" aria-hidden="true">
                <use href="/assets/icons/svg/sprite.svg#close" />
              </svg>
              <span class="accessibility-hidden">Remove Czech</span>
            </button>
          </div>
        </div>
    </div>
    <button type="button" class="UNSTABLE_PickerTrigger" aria-haspopup="dialog" aria-expanded="false">
      <span class="accessibility-hidden">Add</span>
      <svg class="Icon" width="20" height="20" aria-hidden="true">
        <use href="/assets/icons/svg/sprite.svg#chevron-down" />
      </svg>
    </button>
  </div>
</div>
