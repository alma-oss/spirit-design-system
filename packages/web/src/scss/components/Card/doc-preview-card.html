<!-- doc-preview-guides: vertical -->
<div style="width: 480px">
  <article class="Card Card--horizontal Card--boxed">
    <div class="CardMedia CardMedia--medium CardMedia--filledHeight">
      <div
        class="CardMedia__canvas"
        style="
          background-color: var(--spirit-color-accent-01-background-subtle);
          background-image:
            radial-gradient(
              at 15% 20%,
              color-mix(in srgb, var(--spirit-color-accent-02-background-basic) 55%, transparent) 0,
              transparent 60%
            ),
            radial-gradient(
              at 85% 15%,
              color-mix(in srgb, var(--spirit-color-accent-03-background-basic) 50%, transparent) 0,
              transparent 60%
            ),
            radial-gradient(
              at 80% 85%,
              color-mix(in srgb, var(--spirit-color-accent-04-background-basic) 55%, transparent) 0,
              transparent 60%
            ),
            radial-gradient(
              at 20% 90%,
              color-mix(in srgb, var(--spirit-color-accent-01-background-basic) 45%, transparent) 0,
              transparent 65%
            );
        "
      ></div>
    </div>
    <div class="CardBody">
      <div class="CardEyebrow">Eyebrow</div>
      <h4 class="CardTitle CardTitle--heading">
        <a href="#" class="CardLink">Card label</a>
      </h4>
      <p>A short description of the card content.</p>
    </div>
    <footer class="CardFooter CardFooter--alignmentXLeft">
      <a href="#" class="Button Button--small Button--primary">Primary</a>
      <a href="#" class="Button Button--small Button--secondary">Secondary</a>
    </footer>
  </article>
</div>
