<fieldset class="SegmentedControl SegmentedControl--outline" style="width: 280px;">
  <legend class="accessibility-hidden">Label</legend>
  <input
    type="radio"
    id="card-segmented-1"
    name="card-segmented"
    value="1"
    class="SegmentedControlItem__input"
    checked
  />
  <label for="card-segmented-1" class="SegmentedControlItem__label"><span class="text-truncate">Day</span></label>
  <input
    type="radio"
    id="card-segmented-2"
    name="card-segmented"
    value="2"
    class="SegmentedControlItem__input"
  />
  <label for="card-segmented-2" class="SegmentedControlItem__label"><span class="text-truncate">Week</span></label>
  <input
    type="radio"
    id="card-segmented-3"
    name="card-segmented"
    value="3"
    class="SegmentedControlItem__input"
  />
  <label for="card-segmented-3" class="SegmentedControlItem__label"><span class="text-truncate">Month</span></label>
</fieldset>
